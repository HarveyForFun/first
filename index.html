// Firebase 初始化

import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeMdvnKz7xDdiObz6eKCHJ3ZEX5Xj7AVI",
  authDomain: "first-ba4c0.firebaseapp.com",
  projectId: "first-ba4c0",
  storageBucket: "first-ba4c0.appspot.com",

  appId: "1:877853934641:web:678fc96d4054762f9fc110",

};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isLogin = true;
let currentUser = null;
let allLogs = [];
let weatherChart = null;
let moodChart = null;

// 登录/注册
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return alert('请输入邮箱和密码');
  if(isLogin){
    signInWithEmailAndPassword(auth, email, password)
      .then(res => { currentUser = res.user; })
      .catch(err => alert('登录失败: '+err.message));
  } else {
    createUserWithEmailAndPassword(auth, email, password)
      .then(res => { alert('注册成功！请登录'); toggleAuthForm(); })
      .catch(err => alert('注册失败: '+err.message));
  }
}
function toggleAuthForm(){
  isLogin = !isLogin;
  document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authButton').textContent = isLogin ? '登录' : '注册';
  document.getElementById('toggleAuth').textContent = isLogin ? '切换到注册' : '切换到登录';
}

// 上传日志
function addLifeLog() {
  const text = document.getElementById('lifeLog').value.trim();
  if (!text) return alert('日志不能为空');
  if (!currentUser) return alert('请先登录');
  const mood = document.getElementById('moodSelect').value;
  const weather = document.getElementById('weatherSelect').value;

  addDoc(collection(db, 'logs'), {
    uid: currentUser.uid,
    text, mood, weather, ts: Date.now()
  }).then(()=> {
    document.getElementById('lifeLog').value = '';
    loadAllLogs();
  }).catch(err => alert('上传失败: '+err.message));
}

// 加载日志
async function loadAllLogs() {
  if (!currentUser) return;
  const userId = currentUser.uid;
  const recentLogs = document.getElementById('recentLogs');
  const historyLogs = document.getElementById('historyLogs');
  const dayLogs = document.getElementById('dayLogs');
  recentLogs.innerHTML = ''; historyLogs.innerHTML = ''; dayLogs.innerHTML = '';

  const q = query(collection(db, 'logs'), where('uid','==',userId));
  const snapshot = await getDocs(q);
  allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  allLogs.sort((a,b) => b.ts - a.ts);

  allLogs.forEach((doc,i)=>{
    const li = document.createElement('li');
    li.textContent = `${doc.text} [${doc.mood} ${doc.weather}]`;
    if(i<5) recentLogs.appendChild(li);
    historyLogs.appendChild(li.cloneNode(true));
  });

  showDayLogs(new Date());
  initStatYearSelect();
  updateCharts();
}
function showDayLogs(date){
  const dayLogs = document.getElementById('dayLogs'); dayLogs.innerHTML = '';
  const start = new Date(date); start.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(23,59,59,999);

  const logs = allLogs.filter(d => d.ts >= start.getTime() && d.ts <= end.getTime());
  if(logs.length){ const latest = logs[0];
    document.getElementById('moodSelect').value = latest.mood;
    document.getElementById('weatherSelect').value = latest.weather;
  }
  logs.forEach(d=>{
    const li = document.createElement('li');
    li.textContent = `${d.text} [${d.mood} ${d.weather}]`;
    dayLogs.appendChild(li);
  });
}
function toggleHistory(){
  const el = document.getElementById('historyLogs');
  el.style.display = el.style.display==='none'?'block':'none';
}
function initStatYearSelect(){
  const yearSelect = document.getElementById('statYearSelect');
  yearSelect.innerHTML = '';
  const years = [...new Set(allLogs.map(l=>new Date(l.ts).getFullYear()))];
  const currentYear = new Date().getFullYear();
  if(!years.includes(currentYear)) years.push(currentYear);
  years.sort((a,b)=>b-a);
  years.forEach(y=>{
    const option = document.createElement('option');
    option.value = y;
    option.textContent = y;
    if(y===currentYear) option.selected = true;
    yearSelect.appendChild(option);
  });
}
function updateCharts(){
  const year = parseInt(document.getElementById('statYearSelect').value);
  const month = document.getElementById('statMonthSelect').value;
  let filtered = allLogs.filter(d=>{
    const date = new Date(d.ts);
    if(date.getFullYear()!==year) return false;
    if(month!=='all' && date.getMonth()!==parseInt(month)) return false;
    return true;
  });

  // 天气统计
  const weatherCounts = {};
  filtered.forEach(d=>{ weatherCounts[d.weather] = (weatherCounts[d.weather]||0)+1; });
  const wLabels = Object.keys(weatherCounts), wData = Object.values(weatherCounts);
  const wCtx = document.getElementById('weatherChart').getContext('2d');
  if(weatherChart) weatherChart.destroy();
  weatherChart = new Chart(wCtx,{
    type:'pie', data:{labels:wLabels, datasets:[{data:wData, backgroundColor:['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF']}]},
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });

  // 心情统计
  const moodCounts = {};
  filtered.forEach(d=>{ moodCounts[d.mood] = (moodCounts[d.mood]||0)+1; });
  const mLabels = Object.keys(moodCounts), mData = Object.values(moodCounts);
  const mCtx = document.getElementById('moodChart').getContext('2d');
  if(moodChart) moodChart.destroy();
  moodChart = new Chart(mCtx,{
    type:'pie', data:{labels:mLabels, datasets:[{data:mData, backgroundColor:['#FF9F40','#FF6384','#36A2EB','#9966FF','#4BC0C0']}]},
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });
}

onAuthStateChanged(auth, user=>{
  if(user){
