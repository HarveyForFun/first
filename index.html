<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情与天气日志</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    margin: 0;
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(to bottom right, #0b1d3a, #122e5c, #1a3a70);
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  /* 流星画布 */
  #meteorCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    display: flex;
    height: 100vh;
    position: relative;
    z-index: 1;
    padding: 20px;
    box-sizing: border-box;
  }

  .left-panel, .right-panel {
    background: rgba(0,0,0,0.4);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    padding: 20px;
  }

  .left-panel {
    flex: 6;
    margin-right: 20px;
    display: flex;
    flex-direction: column;
  }

  .right-panel {
    flex: 4;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .section-title {
    font-size: 1.2rem;
    margin-bottom: 10px;
    text-align: center;
  }

  textarea {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: none;
    padding: 10px;
    font-size: 14px;
    background: rgba(255,255,255,0.9);
    color: #000;
  }

  select, input[type="date"] {
    border-radius: 8px;
    border: none;
    padding: 5px;
    background: rgba(255,255,255,0.85);
    font-size: 14px;
    color: #000;
  }

  select option {
    background: rgba(60,60,60,0.9);
    color: #fff;
  }

  button {
    background: #1f62c1;
    border: none;
    border-radius: 8px;
    color: #fff;
    padding: 8px 12px;
    margin-top: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.3s;
  }

  button:hover {
    background: #2c7efc;
  }

  .log-entry {
    background: rgba(255,255,255,0.9);
    color: #000;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    max-height: 150px;
    overflow-y: auto;
  }

  .weather-chart {
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 10px;
    text-align: center;
  }

  canvas#weatherPie {
    max-width: 250px;
    max-height: 250px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<canvas id="meteorCanvas"></canvas>
<div class="container">
  <!-- 左边：日志输入 -->
  <div class="left-panel">
    <div class="section-title">✍️ 今日日志</div>
    <input type="date" id="dateInput">
    <div style="margin-top:10px;">
      <label>字体：</label>
      <select id="fontSelect">
        <option value="Microsoft YaHei">微软雅黑</option>
        <option value="SimSun">宋体</option>
        <option value="KaiTi">楷体</option>
      </select>
      <label style="margin-left:10px;">字号：</label>
      <select id="fontSizeSelect">
        <option value="12px">12</option>
        <option value="14px">14</option>
        <option value="16px" selected>16</option>
        <option value="18px">18</option>
        <option value="20px">20</option>
      </select>
    </div>
    <div style="margin-top:10px;">
      <label>心情：</label>
      <select id="moodSelect">
        <option>😊 开心</option>
        <option>😐 平静</option>
        <option>😔 低落</option>
        <option>😡 生气</option>
      </select>
      <label style="margin-left:10px;">天气：</label>
      <select id="weatherSelect">
        <option>☀️ 晴</option>
        <option>🌧️ 雨</option>
        <option>⛅ 多云</option>
        <option>❄️ 雪</option>
      </select>
    </div>
    <textarea id="logInput" placeholder="写下今天的想法吧..."></textarea>
    <button onclick="saveLog()">保存日志</button>
  </div>

  <!-- 右边 -->
  <div class="right-panel">
    <!-- 日志记录 -->
    <div>
      <div class="section-title">📚 日志记录</div>
      <div id="logContainer"></div>
    </div>

    <!-- 天气统计 -->
    <div class="weather-chart">
      <div class="section-title">🌦️ 天气统计</div>
      <canvas id="weatherPie"></canvas>
      <button onclick="updateChart()">更新统计</button>
    </div>
  </div>
</div>

<script>
let logs = JSON.parse(localStorage.getItem("logs") || "[]");
let chart;

function saveLog() {
  const date = document.getElementById("dateInput").value;
  const mood = document.getElementById("moodSelect").value;
  const weather = document.getElementById("weatherSelect").value;
  const text = document.getElementById("logInput").value;
  if (!date || !text) return alert("请填写日期和日志内容！");
  const font = document.getElementById("fontSelect").value;
  const fontSize = document.getElementById("fontSizeSelect").value;

  logs.push({date, mood, weather, text, font, fontSize});
  localStorage.setItem("logs", JSON.stringify(logs));
  renderLogs();
  updateChart();
}

function renderLogs() {
  const container = document.getElementById("logContainer");
  container.innerHTML = "";
  logs.forEach(log => {
    const div = document.createElement("div");
    div.className = "log-entry";
    div.style.fontFamily = log.font;
    div.style.fontSize = log.fontSize;
    div.innerHTML = `<b>${log.date}</b> ${log.mood} ${log.weather}<br>${log.text}`;
    container.appendChild(div);
  });
}

function updateChart() {
  const ctx = document.getElementById("weatherPie").getContext("2d");
  const counts = { "☀️ 晴":0, "🌧️ 雨":0, "⛅ 多云":0, "❄️ 雪":0 };
  logs.forEach(l => counts[l.weather]++);
  const data = Object.values(counts);
  const labels = Object.keys(counts);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: ["#ffce56","#36a2eb","#aaa","#c2e0ff"]
      }]
    }
  });
}

renderLogs();
updateChart();

// ====== 流星特效 ======
const canvas = document.getElementById("meteorCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function createMeteor() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height / 2;
  const len = 150;
  const speed = 8;
  let opacity = 1;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    const grad = ctx.createLinearGradient(x, y, x - len, y + len);
    grad.addColorStop(0, "rgba(255,255,255," + opacity + ")");
    grad.addColorStop(1, "transparent");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.moveTo(x, y);
    ctx.lineTo(x - len, y + len);
    ctx.stroke();
  }

  let frame = 0;
  function animate() {
    if (frame > 80) return;
    frame++;
    opacity -= 0.012;
    draw();
    requestAnimationFrame(animate);
  }
  animate();
}

setInterval(() => {
  createMeteor();
}, Math.random() * 5000 + 5000);

</script>
</body>
</html>
