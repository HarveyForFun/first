<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心情与天气日志面板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="grid grid-cols-5 gap-6">
    <!-- 左侧日志栏 -->
    <div class="col-span-2">
      <div class="bg-white rounded-2xl shadow-md p-4 h-full flex flex-col">
        <h2 class="text-xl font-bold mb-3">日志记录</h2>
        <textarea 
          id="logInput"
          class="flex-1 border rounded-lg p-2 resize-none mb-3 focus:ring-2 focus:ring-blue-400"
          placeholder="写下今天的心情或小记..."
        ></textarea>
        <button 
          id="addLogBtn"
          class="bg-blue-500 text-white rounded-lg py-2 hover:bg-blue-600 transition"
        >添加日志</button>
        <ul id="logList" class="mt-4 space-y-2 text-gray-700 overflow-auto max-h-64"></ul>
      </div>
    </div>

    <!-- 右侧：心情、天气、统计 -->
    <div class="col-span-3 flex flex-col gap-6">
      <div class="bg-white rounded-2xl shadow-md p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-lg font-semibold mb-2">今日心情</h2>
          <select id="moodSelect" class="border rounded-lg p-2">
            <option>开心</option>
            <option>平静</option>
            <option>难过</option>
            <option>紧张</option>
            <option>兴奋</option>
          </select>
        </div>
        <div>
          <h2 class="text-lg font-semibold mb-2">今日天气</h2>
          <select id="weatherSelect" class="border rounded-lg p-2">
            <option>晴</option>
            <option>多云</option>
            <option>小雨</option>
            <option>雷阵雨</option>
            <option>阴</option>
          </select>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-md p-4 flex flex-col items-center">
        <h2 class="text-lg font-semibold mb-3">心情分布统计</h2>
        <div class="max-w-[250px]">
          <canvas id="moodChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始化日志功能
    const logInput = document.getElementById("logInput");
    const logList = document.getElementById("logList");
    document.getElementById("addLogBtn").addEventListener("click", () => {
      const text = logInput.value.trim();
      if (!text) return;
      const li = document.createElement("li");
      li.className = "bg-gray-100 p-2 rounded-md";
      li.textContent = text;
      logList.prepend(li);
      logInput.value = "";
    });

    // 饼图初始化
    const ctx = document.getElementById("moodChart");
    const moodChart = new Chart(ctx, {
      type: "pie",
      data: {
        labels: ["开心", "平静", "难过", "紧张", "兴奋"],
        datasets: [{
          data: [12, 8, 5, 3, 7],
          backgroundColor: [
            "#60a5fa", "#93c5fd", "#f87171", "#fbbf24", "#34d399"
          ]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "bottom" }
        }
      }
    });

    // 模拟动态刷新（5-10秒随机）
    function randomUpdate() {
      moodChart.data.datasets[0].data = moodChart.data.datasets[0].data.map(
        () => Math.floor(Math.random() * 15) + 1
      );
      moodChart.update();
      const nextTime = Math.floor(Math.random() * 5000) + 5000; // 5-10秒
      setTimeout(randomUpdate, nextTime);
    }
    randomUpdate();
  </script>
</body>
</html>
