<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日志</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: url('https://images.unsplash.com/photo-1602524819260-1d556fdf3a8a?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
}
.container {
  max-width: 850px;
  margin: 50px auto;
  background: rgba(0,0,0,0.7);
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
h2 { text-align: center; font-size: 2rem; margin-bottom: 20px; }
textarea {
  width: 90%; /* 缩小10% */
  height: 180px;
  padding: 15px;
  font-size: 1.2rem;
  font-family: 'Georgia', serif;
  line-height: 1.6;
  border-radius: 10px;
  border: none;
  resize: vertical;
  outline: none;
}
input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 1rem;
}
button {
  cursor: pointer;
  background: linear-gradient(45deg, #ff6ec4, #7873f5);
  color: #fff;
  font-weight: bold;
  transition: all 0.2s ease;
}
button:hover { transform: scale(1.05); background: linear-gradient(45deg, #7873f5, #ff6ec4); }
ul { list-style: none; padding-left: 0; max-height: 200px; overflow-y: auto; }
li { margin: 5px 0; background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 5px; }
#authForm { max-width: 400px; margin: 80px auto; background: rgba(0,0,0,0.75); padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);}
#toggleAuth { text-align:center; margin-top:12px; cursor:pointer; color:#00ffff; font-weight:bold; }
select { background: rgba(255,255,255,0.2); color: #fff; }
#calendar { margin-bottom: 10px; }
.stats { margin-top:20px; background: rgba(255,255,255,0.1); padding:10px; border-radius:10px; }
.flex-row { display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>

<!-- 登录/注册表单 -->
<div id="authForm">
  <h2 id="formTitle">登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="authButton">登录</button>
  <div id="toggleAuth">切换到注册</div>
</div>

<!-- 日志主页面 -->
<div class="container" id="mainPage" style="display:none;">
  <h2>日志</h2>

  <!-- 注销 -->
  <button id="logoutBtn" style="background:#f44336;">注销</button>

  <!-- 日历选择 -->
  <input type="text" id="calendar" placeholder="选择日期">

  <!-- 字体、字号、心情、天气 -->
  <div class="flex-row" style="margin-bottom:10px;">
    <select id="fontSelect">
      <option value="Georgia, serif">Georgia</option>
      <option value="'Segoe UI', sans-serif">Segoe UI</option>
      <option value="Courier New, monospace">Courier New</option>
      <option value="Arial, sans-serif">Arial</option>
    </select>
    <select id="fontSizeSelect">
      <option value="1rem">16px</option>
      <option value="1.2rem">18px</option>
      <option value="1.4rem">20px</option>
      <option value="1.6rem">22px</option>
    </select>
    <select id="moodSelect">
      <option value="😃 开心">😃 开心</option>
      <option value="😞 难受">😞 难受</option>
      <option value="😐 平静">😐 平静</option>
      <option value="😡 生气">😡 生气</option>
      <option value="😴 疲惫">😴 疲惫</option>
    </select>
    <select id="weatherSelect">
      <option value="☀️ 晴天">☀️ 晴天</option>
      <option value="☁️ 阴天">☁️ 阴天</option>
      <option value="🌧️ 雨天">🌧️ 雨天</option>
      <option value="⛄ 雪天">⛄ 雪天</option>
      <option value="🌫️ 雾天">🌫️ 雾天</option>
    </select>
  </div>

  <textarea id="lifeLog" placeholder="写下今天的日志"></textarea>
  <button id="uploadBtn">上传日志</button>

  <h3>最近5条日志</h3>
  <ul id="recentLogs"></ul>

  <button id="historyBtn">历史记录</button>
  <ul id="historyLogs" style="display:none"></ul>

  <h3>当天日志</h3>
  <ul id="dayLogs"></ul>

  <div class="stats">
    <h3>统计</h3>
    <button id="monthStatsBtn">按月统计</button>
    <button id="yearStatsBtn">按年统计</button>
    <div id="statsResult"></div>
  </div>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script type="module">
// Firebase 初始化
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeMdvnKz7xDdiObz6eKCHJ3ZEX5Xj7AVI",
  authDomain: "first-ba4c0.firebaseapp.com",
  projectId: "first-ba4c0",
  storageBucket: "first-ba4c0.appspot.com",
  messagingSenderId: "877853934641",
  appId: "1:877853934641:web:678fc96d4054762f9fc110",
  measurementId: "G-DETSMZTR64"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isLogin = true;
let currentUser = null;
let allLogs = [];

// 登录/注册
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return alert('请输入邮箱和密码');

  if(isLogin){
    signInWithEmailAndPassword(auth, email, password)
      .then(res => { currentUser = res.user; })
      .catch(err => alert('登录失败: '+err.message));
  } else {
    createUserWithEmailAndPassword(auth, email, password)
      .then(res => { alert('注册成功！请登录'); toggleAuthForm(); })
      .catch(err => alert('注册失败: '+err.message));
  }
}

function toggleAuthForm(){
  isLogin = !isLogin;
  document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authButton').textContent = isLogin ? '登录' : '注册';
  document.getElementById('toggleAuth').textContent = isLogin ? '切换到注册' : '切换到登录';
}

// 上传日志
function addLifeLog() {
  const text = document.getElementById('lifeLog').value.trim();
  if (!text) return alert('日志不能为空');
  if (!currentUser) return alert('请先登录');

  const mood = document.getElementById('moodSelect').value;
  const weather = document.getElementById('weatherSelect').value;

  addDoc(collection(db, 'logs'), {
    uid: currentUser.uid,
    text,
    mood,
    weather,
    ts: Date.now()
  })
  .then(()=> {
    document.getElementById('lifeLog').value = '';
    loadAllLogs();
  })
  .catch(err => alert('上传失败: '+err.message));
}

// 加载所有日志
async function loadAllLogs() {
  if (!currentUser) return;
  const userId = currentUser.uid;
  const recentLogs = document.getElementById('recentLogs');
  const historyLogs = document.getElementById('historyLogs');
  const dayLogs = document.getElementById('dayLogs');
  recentLogs.innerHTML = '';
  historyLogs.innerHTML = '';
  dayLogs.innerHTML = '';

  const q = query(collection(db, 'logs'), where('uid','==',userId));
  const snapshot = await getDocs(q);
  allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  allLogs.sort((a,b) => b.ts - a.ts);

  allLogs.forEach((doc,i)=>{
    const li = document.createElement('li');
    li.textContent = `${doc.text} [${doc.mood} ${doc.weather}]`;
    if(i<5) recentLogs.appendChild(li);
    historyLogs.appendChild(li.cloneNode(true));
  });

  showDayLogs(new Date());
}

// 显示指定日期日志 & 自动填充心情/天气
function showDayLogs(date) {
  const dayLogs = document.getElementById('dayLogs');
  dayLogs.innerHTML = '';
  const start = new Date(date); start.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(23,59,59,999);

  const logs = allLogs.filter(d => d.ts >= start.getTime() && d.ts <= end.getTime());

  if(logs.length){
    const latest = logs[logs.length - 1];
    document.getElementById('moodSelect').value = latest.mood;
    document.getElementById('weatherSelect').value = latest.weather;
  }

  logs.forEach(d=>{
    const li = document.createElement('li');
    li.textContent = `${d.text} [${d.mood} ${d.weather}]`;
    dayLogs.appendChild(li);
  });
}

// 历史记录切换
function toggleHistory(){
  const el = document.getElementById('historyLogs');
  el.style.display = el.style.display==='none'?'block':'none';
}

// 统计
function showStats(type) {
  const result = document.getElementById('statsResult');
  result.innerHTML = '';
  const stats = {};
  allLogs.forEach(d=>{
    const date = new Date(d.ts);
    let key = type==='month' ? `${date.getFullYear()}-${date.getMonth()+1}` : `${date.getFullYear()}`;
    if(!stats[key]) stats[key] = {mood:{}, weather:{}};
    stats[key].mood[d.mood] = (stats[key].mood[d.mood]||0)+1;
    stats[key].weather[d.weather] = (stats[key].weather[d.weather]||0)+1;
  });
  for(const k in stats){
    const div = document.createElement('div');
    div.innerHTML = `<strong>${k}</strong><br>Mood: ${JSON.stringify(stats[k].mood)}<br>Weather: ${JSON.stringify(stats[k].weather)}`;
    result.appendChild(div);
  }
}

// 字体选择
document.getElementById('fontSelect').addEventListener('change', e=>{
  document.getElementById('lifeLog').style.fontFamily = e.target.value;
});
document.getElementById('fontSizeSelect').addEventListener('change', e=>{
  document.getElementById('lifeLog').style.fontSize = e.target.value;
});

// ===== 绑定事件 =====
document.getElementById('authButton').addEventListener('click', handleAuth);
document.getElementById('toggleAuth').addEventListener('click', toggleAuthForm);
document.getElementById('uploadBtn').addEventListener('click', addLifeLog);
document.getElementById('historyBtn').addEventListener('click', toggleHistory);
document.getElementById('monthStatsBtn').addEventListener('click', ()=>showStats('month'));
document.getElementById('yearStatsBtn').addEventListener('click', ()=>showStats('year'));
document.getElementById('logoutBtn').addEventListener('click', ()=>signOut(auth));

// flatpickr 日历
flatpickr("#calendar", {
  dateFormat: "Y-m-d",
  defaultDate: new Date(),
  minDate: new Date().getFullYear() - 10 + "-01-01",
  maxDate: new Date(),
  onChange: function(selectedDates){
    if(selectedDates.length) showDayLogs(selectedDates[0]);
  }
});

// 保持登录状态
onAuthStateChanged(auth, user => {
  if(user){
    currentUser = user;
    document.getElementById('authForm').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    loadAllLogs();
  } else {
    currentUser = null;
    document.getElementById('authForm').style.display = 'block';
    document.getElementById('mainPage').style.display = 'none';
  }
});
</script>

</body>
</html>
