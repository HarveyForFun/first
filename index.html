<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日志 + 塔罗 + 统计</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0a1a40, #001f54);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
}
.container {
  max-width: 1200px;
  margin: 20px auto;
  background: rgba(0,0,0,0.6);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  gap: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.left, .center {
  padding: 10px;
}
.left { width: 25%; display:flex; flex-direction:column; gap:10px; }
.center { width: 75%; display:flex; flex-direction:column; gap:10px; }
h2,h3 { text-align: center; margin-bottom: 10px; }
textarea {
  width: 100%;
  height: 200px;
  padding: 15px;
  font-size: 1rem;
  font-family: 'Georgia', serif;
  line-height: 1.6;
  border-radius: 10px;
  border: none;
  resize: vertical;
  outline: none;
}
input, select, button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 1rem;
}
select {
  background: rgba(50,50,50,0.7);
  color: #fff;
}
select option {
  background: rgba(50,50,50,0.9);
  color: #fff;
}
select option:hover { background: #666; }
button {
  cursor: pointer;
  background: linear-gradient(45deg, #ff6ec4, #7873f5);
  color: #fff;
  font-weight: bold;
  transition: all 0.2s ease;
}
button:hover { transform: scale(1.05); background: linear-gradient(45deg, #7873f5, #ff6ec4); }
ul { list-style: none; padding-left: 0; max-height: 200px; overflow-y: auto; }
li { margin: 5px 0; background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 5px; }
#authForm { max-width: 400px; margin: 80px auto; background: rgba(0,0,0,0.75); padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);}
#toggleAuth { text-align:center; margin-top:12px; cursor:pointer; color:#00ffff; font-weight:bold }
.flex-col { display:flex; flex-direction:column; gap:5px; }
.stats { margin-top:10px; background: rgba(255,255,255,0.1); padding:10px; border-radius:10px; }
.stats canvas { width: 200px; height: 200px; }
#tarotResult { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; min-height:50px; }
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="authForm">
  <h2 id="formTitle">登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="authButton">登录</button>
  <div id="toggleAuth">切换到注册</div>
</div>

<!-- 主页面 -->
<div class="container" id="mainPage" style="display:none;">

  <!-- 左栏 -->
  <div class="left">
    <h3>选择日期</h3>
    <input type="text" id="calendar" placeholder="选择日期">

    <div class="flex-col">
      <label>🖋 字体</label>
      <select id="fontSelect">
        <option value="Georgia, serif">Georgia</option>
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="Courier New, monospace">Courier New</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Times New Roman, serif">Times New Roman</option>
      </select>
    </div>

    <div class="flex-col">
      <label>🪶 字号</label>
      <select id="fontSizeSelect">
        <option value="0.75rem">12px</option>
        <option value="0.875rem">14px</option>
        <option value="1rem">16px</option>
        <option value="1.125rem">18px</option>
        <option value="1.25rem">20px</option>
      </select>
    </div>

    <div class="flex-col">
      <label>😃 心情</label>
      <select id="moodSelect">
        <option value="😃 开心">😃 开心</option>
        <option value="😞 难受">😞 难受</option>
        <option value="😐 平静">😐 平静</option>
        <option value="😡 生气">😡 生气</option>
        <option value="😴 疲惫">😴 疲惫</option>
      </select>
    </div>

    <div class="flex-col">
      <label>☀️ 天气</label>
      <select id="weatherSelect">
        <option value="☀️ 晴天">☀️ 晴天</option>
        <option value="☁️ 阴天">☁️ 阴天</option>
        <option value="🌧️ 雨天">🌧️ 雨天</option>
        <option value="⛄ 雪天">⛄ 雪天</option>
        <option value="🌫️ 雾天">🌫️ 雾天</option>
      </select>
    </div>

    <div class="flex-col">
      <button id="tarotBtn">开始占卜</button>
      <div id="tarotResult"></div>
    </div>

    <button id="uploadBtn">上传日志</button>
    <button id="logoutBtn" style="background:#f44336;">🔴 注销</button>
  </div>

  <!-- 中间栏 -->
  <div class="center">
    <h2>当天日志</h2>
    <textarea id="lifeLog" placeholder="写下今天的日志"></textarea>
    <ul id="dayLogs"></ul>

    <div class="stats" id="statsContainer">
      <h3>统计</h3>
      <div style="display:flex; gap:10px;">
        <canvas id="weatherChart"></canvas>
        <canvas id="moodChart"></canvas>
      </div>
      <label>选择年份</label>
      <select id="statYearSelect"></select>
      <label>选择月份</label>
      <select id="statMonthSelect">
        <option value="all">全部</option>
        <option value="0">1月</option><option value="1">2月</option><option value="2">3月</option>
        <option value="3">4月</option><option value="4">5月</option><option value="5">6月</option>
        <option value="6">7月</option><option value="7">8月</option><option value="8">9月</option>
        <option value="9">10月</option><option value="10">11月</option><option value="11">12月</option>
      </select>
      <button id="updateChartBtn">更新统计</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script type="module">
// Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeMdvnKz7xDdiObz6eKCHJ3ZEX5Xj7AVI",
  authDomain: "first-ba4c0.firebaseapp.com",
  projectId: "first-ba4c0",
  storageBucket: "first-ba4c0.appspot.com",
  messagingSenderId: "877853934641",
  appId: "1:877853934641:web:678fc96d4054762f9fc110",
  measurementId: "G-DETSMZTR64"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isLogin = true;
let currentUser = null;
let allLogs = [];
let weatherChart = null;
let moodChart = null;

// 登录/注册
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return alert('请输入邮箱和密码');

  if(isLogin){
    signInWithEmailAndPassword(auth, email, password)
      .then(res => { currentUser = res.user; })
      .catch(err => alert('登录失败: '+err.message));
  } else {
    createUserWithEmailAndPassword(auth, email, password)
      .then(res => { alert('注册成功！请登录'); toggleAuthForm(); })
      .catch(err => alert('注册失败: '+err.message));
  }
}

function toggleAuthForm(){
  isLogin = !isLogin;
  document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authButton').textContent = isLogin ? '登录' : '注册';
  document.getElementById('toggleAuth').textContent = isLogin ? '切换到注册' : '切换到登录';
}

// 上传日志
function addLifeLog() {
  const text = document.getElementById('lifeLog').value.trim();
  if (!text) return alert('日志不能为空');
  if (!currentUser) return alert('请先登录');

  const mood = document.getElementById('moodSelect').value;
  const weather = document.getElementById('weatherSelect').value;

  addDoc(collection(db, 'logs'), {
    uid: currentUser.uid,
    text,
    mood,
    weather,
    ts: Date.now()
  })
  .then(()=> {
    document.getElementById('lifeLog').value = '';
    loadAllLogs();
  })
  .catch(err => alert('上传失败: '+err.message));
}

// 加载日志
async function loadAllLogs() {
  if (!currentUser) return;
  const userId = currentUser.uid;
  const dayLogs = document.getElementById('dayLogs');
  dayLogs.innerHTML = '';

  const q = query(collection(db, 'logs'), where('uid','==',userId));
  const snapshot = await getDocs(q);
  allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  allLogs.sort((a,b) => b.ts - a.ts);

  showDayLogs(new Date());
  initStatYearSelect();
  updateCharts();
}

// 显示当天日志 & 自动填充心情/天气
function showDayLogs(date) {
  const dayLogs = document.getElementById('dayLogs');
  dayLogs.innerHTML = '';
  const start = new Date(date); start.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(23,59,59,999);

  const logs = allLogs.filter(d => d.ts >= start.getTime() && d.ts <= end.getTime());
  if(logs.length){
    const latest = logs[0];
    document.getElementById('moodSelect').value = latest.mood;
    document.getElementById('weatherSelect').value = latest.weather;
  }

  logs.forEach(d=>{
    const li = document.createElement('li');
    li.textContent = `${d.text} [${d.mood} ${d.weather}]`;
    dayLogs.appendChild(li);
  });
}

// 历史记录切换
function toggleHistory(){}

// 初始化年份下拉
function initStatYearSelect(){
  const yearSelect = document.getElementById('statYearSelect');
  yearSelect.innerHTML = '';
  const years = [...new Set(allLogs.map(l=>new Date(l.ts).getFullYear()))];
  const currentYear = new Date().getFullYear();
  if(!years.includes(currentYear)) years.push(currentYear);
  years.sort((a,b)=>b-a);
  years.forEach(y=>{
    const option = document.createElement('option');
    option.value = y;
    option.textContent = y;
    if(y===currentYear) option.selected = true;
    yearSelect.appendChild(option);
  });
}

// 更新双饼图
function updateCharts(){
  const year = parseInt(document.getElementById('statYearSelect').value);
  const month = document.getElementById('statMonthSelect').value;
  let filtered = allLogs.filter(d=>{
    const date = new Date(d.ts);
    if(date.getFullYear()!==year) return false;
    if(month!=='all' && date.getMonth()!==parseInt(month)) return false;
    return true;
  });

  const weatherCounts = {};
  const moodCounts = {};
  filtered.forEach(d=>{
    weatherCounts[d.weather] = (weatherCounts[d.weather]||0)+1;
    moodCounts[d.mood] = (moodCounts[d.mood]||0)+1;
  });

  const weatherCtx = document.getElementById('weatherChart').getContext('2d');
  if(weatherChart) weatherChart.destroy();
  weatherChart = new Chart(weatherCtx,{
    type:'pie',
    data:{
      labels:Object.keys(weatherCounts),
      datasets:[{data:Object.values(weatherCounts), backgroundColor:['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF']}]
    },
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });

  const moodCtx = document.getElementById('moodChart').getContext('2d');
  if(moodChart) moodChart.destroy();
  moodChart = new Chart(moodCtx,{
    type:'pie',
    data:{
      labels:Object.keys(moodCounts),
      datasets:[{data:Object.values(moodCounts), backgroundColor:['#FF9F40','#FF6384','#36A2EB','#9966FF','#4BC0C0']}]
    },
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });
}

// 塔罗牌
const tarotCards = [
  // 大阿尔卡纳
  {name:'愚者', meaning:'表示新的开始、冒险和自由的精神。'},
  {name:'魔术师', meaning:'象征行动力、创造力和潜力的实现。'},
  {name:'女祭司', meaning:'代表直觉、内在智慧和神秘力量。'},
  {name:'皇后', meaning:'象征丰收、滋养与创造力。'},
  {name:'皇帝', meaning:'代表秩序、权力和责任。'},
  {name:'教皇', meaning:'象征智慧、指导和传统价值。'},
  {name:'恋人', meaning:'表示关系、选择和和谐的结合。'},
  {name:'战车', meaning:'象征意志力、掌控和胜利。'},
  {name:'力量', meaning:'代表勇气、耐心和内在力量。'},
  {name:'隐者', meaning:'象征沉思、内省和寻求真理。'},
  {name:'命运之轮', meaning:'表示周期、转变和命运的流动。'},
  {name:'正义', meaning:'象征公平、平衡和因果。'},
  {name:'倒吊人', meaning:'表示牺牲、放下和新视角。'},
  {name:'死神', meaning:'象征结束、转变和重生。'},
  {name:'节制', meaning:'代表平衡、和谐和适度。'},
  {name:'恶魔', meaning:'象征诱惑、束缚和内在阴影。'},
  {name:'塔', meaning:'表示突发变化、觉醒和重建。'},
  {name:'星星', meaning:'象征希望、灵感和疗愈。'},
  {name:'月亮', meaning:'代表潜意识、迷茫和直觉。'},
  {name:'太阳', meaning:'象征成功、喜悦和正能量。'},
  {name:'审判', meaning:'表示觉醒、反思和新生。'},
  {name:'世界', meaning:'象征完成、圆满和成就。'},
  // 小阿尔卡纳：示例 14 张
  {name:'权杖A', meaning:'象征行动、创造力和能量的开始。'},
  {name:'权杖2', meaning:'表示计划、策略和未来方向的探索。'},
  {name:'权杖3', meaning:'象征合作、展望和努力成果的显现。'},
  {name:'权杖4', meaning:'表示稳定、庆祝和成功的阶段。'},
  {name:'权杖5', meaning:'象征冲突、竞争与成长的机会。'},
  {name:'权杖6', meaning:'表示胜利、认可和成就。'},
  {name:'权杖7', meaning:'象征防守、自信与坚持。'},
  {name:'权杖8', meaning:'表示快速变化、消息和进展。'},
  {name:'权杖9', meaning:'象征防御、警觉和坚韧。'},
  {name:'权杖10', meaning:'表示责任、压力和承担的挑战。'},
  {name:'权杖侍者', meaning:'象征学习、探寻和新机会。'},
  {name:'权杖骑士', meaning:'表示行动力、冒险和勇气。'},
  {name:'权杖皇后', meaning:'象征温柔、关怀与领导能力。'},
  {name:'权杖国王', meaning:'表示掌控、权威和决策能力。'},
  {name:'圣杯A', meaning:'象征情感的新开始、爱与灵感。'},
  {name:'圣杯2', meaning:'表示关系、合作与和谐。'}
];

// 塔罗占卜
function drawTarot() {
  const idx = Math.floor(Math.random() * tarotCards.length);
  const card = tarotCards[idx];
  document.getElementById('tarotResult').textContent = `${card.name}：${card.meaning}（约80字）`;
}

// 字体和字号事件
document.getElementById('fontSelect').addEventListener('change', e=>{
  document.getElementById('lifeLog').style.fontFamily = e.target.value;
});
document.getElementById('fontSizeSelect').addEventListener('change', e=>{
  document.getElementById('lifeLog').style.fontSize = e.target.value;
});

// ===== 绑定事件 =====
document.getElementById('authButton').addEventListener('click', handleAuth);
document.getElementById('toggleAuth').addEventListener('click', toggleAuthForm);
document.getElementById('uploadBtn').addEventListener('click', addLifeLog);
document.getElementById('logoutBtn').addEventListener('click', ()=>signOut(auth));
document.getElementById('updateChartBtn').addEventListener('click', updateCharts);
document.getElementById('tarotBtn').addEventListener('click', drawTarot);

// flatpickr 日历
flatpickr("#calendar", {
  dateFormat: "Y-m-d",
  defaultDate: new Date(),
  minDate: new Date().getFullYear() - 10 + "-01-01",
  maxDate: new Date(),
  onChange: function(selectedDates){
    if(selectedDates.length) showDayLogs(selectedDates[0]);
  }
});

// 保持登录状态
onAuthStateChanged(auth, user => {
  if(user){
    currentUser = user;
    document.getElementById('authForm').style.display = 'none';
    document.getElementById('mainPage').style.display = 'flex';
    loadAllLogs();
  } else {
    currentUser = null;
    document.getElementById('authForm').style.display = 'block';
    document.getElementById('mainPage').style.display = 'none';
  }
});
</script>
</body>
</html>
