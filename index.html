body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0a1a40, #001f54);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  position: relative;
}
.container {
  max-width: 1200px;
  margin: 20px auto;
  background: rgba(0,0,0,0.6);
  border-radius: 15px;
  padding: 20px;
  display: flex;
  gap: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.left, .center, .right {
  padding: 10px;
}
.left, .right { width: 25%; }
.center { width: 50%; display:flex; flex-direction:column; gap:10px; }
h2, h3 { text-align: center; margin-bottom: 15px; }
textarea {
  width: 100%;
  height: 250px;
  padding: 15px;
  font-size: 1rem;
  font-family: 'Georgia', serif;
  line-height: 1.6;
  border-radius: 10px;
  border: none;
  resize: vertical;
  outline: none;
}
input, select, button {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 1rem;
}
select {
  background: rgba(50,50,50,0.7);
  color: #fff;
}
select option {
  background: rgba(50,50,50,0.9);
  color: #fff;
}
select option:hover { background: #666; }
button {
  cursor: pointer;
  background: linear-gradient(45deg, #ff6ec4, #7873f5);
  color: #fff;
  font-weight: bold;
  transition: all 0.2s ease;
}
button:hover { transform: scale(1.05); background: linear-gradient(45deg, #7873f5, #ff6ec4); }
ul { list-style: none; padding-left: 0; max-height: 200px; overflow-y: auto; }
li { margin: 5px 0; background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 5px; }
#authForm { max-width: 400px; margin: 80px auto; background: rgba(0,0,0,0.75); padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);}
#toggleAuth { text-align:center; margin-top:12px; cursor:pointer; color:#00ffff; font-weight:bold }
.flex-col { display:flex; flex-direction:column; gap:5px; }
.stats { margin-top:20px; background: rgba(255,255,255,0.1); padding:10px; border-radius:10px; }
canvas { max-width:100%; height:200px; margin-top:10px; }

/* 塔罗牌样式 */
#tarotDeckContainer {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}
.tarot-card {
  width: 80px;
  height: 120px;
  perspective: 600px;
  cursor: pointer;
}
.tarot-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.tarot-card.show-details .tarot-card-inner {
  transform: rotateY(180deg);
}
.tarot-card-front, .tarot-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 0.7rem;
  padding: 5px;
}
.tarot-card-front {
  background: #333;
}
.tarot-card-back {
  background: #444;
  transform: rotateY(180deg);
  flex-direction: column;
}
.tarot-card-back .title { font-weight:bold; margin-bottom:5px; font-size:0.8rem; }
.tarot-card-back .details { font-size:0.65rem; }
</style>

<script type="module">
// Firebase 初始化
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeMdvnKz7xDdiObz6eKCHJ3ZEX5Xj7AVI",
  authDomain: "first-ba4c0.firebaseapp.com",
  projectId: "first-ba4c0",
  storageBucket: "first-ba4c0.appspot.com",
  messagingSenderId: "877853934641",
  appId: "1:877853934641:web:678fc96d4054762f9fc110",
  measurementId: "G-DETSMZTR64"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isLogin = true;
let currentUser = null;
let allLogs = [];
let weatherChart = null;
let moodChart = null;

// 登录/注册
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return alert('请输入邮箱和密码');
  if(isLogin){
    signInWithEmailAndPassword(auth, email, password)
      .then(res => { currentUser = res.user; })
      .catch(err => alert('登录失败: '+err.message));
  } else {
    createUserWithEmailAndPassword(auth, email, password)
      .then(res => { alert('注册成功！请登录'); toggleAuthForm(); })
      .catch(err => alert('注册失败: '+err.message));
  }
}
function toggleAuthForm(){
  isLogin = !isLogin;
  document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authButton').textContent = isLogin ? '登录' : '注册';
  document.getElementById('toggleAuth').textContent = isLogin ? '切换到注册' : '切换到登录';
}

// 上传日志
function addLifeLog() {
  const text = document.getElementById('lifeLog').value.trim();
  if (!text) return alert('日志不能为空');
  if (!currentUser) return alert('请先登录');
  addDoc(collection(db, 'logs'), {
    uid: currentUser.uid,
    text, ts: Date.now()
  }).then(()=> {
    document.getElementById('lifeLog').value = '';
    loadAllLogs();
  }).catch(err => alert('上传失败: '+err.message));
}

// 上传心情或天气
async function uploadMoodWeather(type){
  if(!currentUser) return alert('请先登录');
  const date = new Date();
  const start = new Date(date); start.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(23,59,59,999);
  const q = query(collection(db,'logs'), where('uid','==',currentUser.uid));
  const snapshot = await getDocs(q);
  let todayDoc = snapshot.docs.find(doc=>doc.data().ts >= start.getTime() && doc.data().ts <= end.getTime());
  if(!todayDoc){
    todayDoc = await addDoc(collection(db,'logs'), { uid:currentUser.uid, ts:Date.now() });
  }
  const docRef = todayDoc.ref || doc(db,'logs',todayDoc.id);
  const value = type==='mood'?document.getElementById('moodSelect').value:document.getElementById('weatherSelect').value;
  updateDoc(docRef,{ [type]: value }).then(loadAllLogs);
}

// 加载日志
async function loadAllLogs() {
  if (!currentUser) return;
  const userId = currentUser.uid;
  const recentLogs = document.getElementById('recentLogs');
  const historyLogs = document.getElementById('historyLogs');
  const dayLogs = document.getElementById('dayLogs');
  recentLogs.innerHTML = ''; historyLogs.innerHTML = ''; dayLogs.innerHTML = '';

  const q = query(collection(db, 'logs'), where('uid','==',userId));
  const snapshot = await getDocs(q);
  allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  allLogs.sort((a,b) => b.ts - a.ts);

  allLogs.forEach((doc,i)=>{
    const li = document.createElement('li');
    li.textContent = `${doc.text || ''} [${doc.mood||''} ${doc.weather||''}]`;
    if(i<5) recentLogs.appendChild(li);
    historyLogs.appendChild(li.cloneNode(true));
  });

  showDayLogs(new Date());
  initStatYearSelect();
  updateCharts();
}
function showDayLogs(date){
  const dayLogs = document.getElementById('dayLogs'); dayLogs.innerHTML = '';
  const start = new Date(date); start.setHours(0,0,0,0);
  const end = new Date(date); end.setHours(23,59,59,999);
  const logs = allLogs.filter(d => d.ts >= start.getTime() && d.ts <= end.getTime());
  if(logs.length){ const latest = logs[0];
    if(latest.mood) document.getElementById('moodSelect').value = latest.mood;
    if(latest.weather) document.getElementById('weatherSelect').value = latest.weather;
  }
  logs.forEach(d=>{
    const li = document.createElement('li');
    li.textContent = `${d.text || ''} [${d.mood||''} ${d.weather||''}]`;
    dayLogs.appendChild(li);
  });
}
function toggleHistory(){
  const el = document.getElementById('historyLogs');
  el.style.display = el.style.display==='none'?'block':'none';
}
function initStatYearSelect(){
  const yearSelect = document.getElementById('statYearSelect');
  yearSelect.innerHTML = '';
  const years = [...new Set(allLogs.map(l=>new Date(l.ts).getFullYear()))];
  const currentYear = new Date().getFullYear();
  if(!years.includes(currentYear)) years.push(currentYear);
  years.sort((a,b)=>b-a);
  years.forEach(y=>{
    const option = document.createElement('option');
    option.value = y;
    option.textContent = y;
    if(y===currentYear) option.selected = true;
    yearSelect.appendChild(option);
  });
}
function updateCharts(){
  const year = parseInt(document.getElementById('statYearSelect').value);
  const month = document.getElementById('statMonthSelect').value;
  let filtered = allLogs.filter(d=>{
    const date = new Date(d.ts);
    if(date.getFullYear()!==year) return false;
    if(month!=='all' && date.getMonth()!==parseInt(month)) return false;
    return true;
  });

  // 天气统计
  const weatherCounts = {};
  filtered.forEach(d=>{ if(d.weather) weatherCounts[d.weather] = (weatherCounts[d.weather]||0)+1; });
  const wLabels = Object.keys(weatherCounts), wData = Object.values(weatherCounts);
  const wCtx = document.getElementById('weatherChart').getContext('2d');
  if(weatherChart) weatherChart.destroy();
  weatherChart = new Chart(wCtx,{
    type:'pie', data:{labels:wLabels, datasets:[{data:wData, backgroundColor:['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF']}]},
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });

  // 心情统计
  const moodCounts = {};
  filtered.forEach(d=>{ if(d.mood) moodCounts[d.mood] = (moodCounts[d.mood]||0)+1; });
  const mLabels = Object.keys(moodCounts), mData = Object.values(moodCounts);
  const mCtx = document.getElementById('moodChart').getContext('2d');
  if(moodChart) moodChart.destroy();
  moodChart = new Chart(mCtx,{
    type:'pie', data:{labels:mLabels, datasets:[{data:mData, backgroundColor:['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF']}]},
    options:{responsive:true, plugins:{legend:{position:'bottom'}}}
  });
}

// 渲染塔罗牌
function renderTarotDeck(){
  const container = document.getElementById('tarotDeckContainer');
  container.innerHTML = '';
  tarotDeck.forEach(card=>{
    const cardEl = document.createElement('div');
    cardEl.className = 'tarot-card';
    cardEl.innerHTML = `
      <div class="tarot-card-inner">
        <div class="tarot-card-front">牌背</div>
        <div class="tarot-card-back">
          <div class="title">${card.name}</div>
          <div class="details">${card.desc}</div>
        </div>
      </div>`;
    cardEl.onclick = ()=>{ cardEl.classList.toggle('show-details'); }
    container.appendChild(cardEl);
  });
}

// 初始化
document.getElementById('authButton').onclick = handleAuth;
document.getElementById('toggleAuth').onclick = toggleAuthForm;
document.getElementById('uploadBtn').onclick = addLifeLog;
document.getElementById('uploadMoodBtn').onclick = ()=>uploadMoodWeather('mood');
document.getElementById('uploadWeatherBtn').onclick = ()=>uploadMoodWeather('weather');
document.getElementById('historyBtn').onclick = toggleHistory;
document.getElementById('updateChartBtn').onclick = updateCharts;
document.getElementById('logoutBtn').onclick = ()=>{
  signOut(auth).then(()=>{
    currentUser = null;
    document.getElementById('mainPage').style.display='none';
    document.getElementById('authForm').style.display='block';
  });
};

// 监听登录状态
onAuthStateChanged(auth,user=>{
  if(user){
    currentUser = user;
    document.getElementById('mainPage').style.display='flex';
    document.getElementById('authForm').style.display='none';
    loadAllLogs();
    renderTarotDeck();
  } else {
    currentUser = null;
    document.getElementById('mainPage').style.display='none';
    document.getElementById('authForm').style.display='block';
  }
});
