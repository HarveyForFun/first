<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人日志空间</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #ffecd2, #fcb69f);
  margin: 0;
  padding: 0;
}
.container {
  max-width: 700px;
  margin: 50px auto;
  background: rgba(255,255,255,0.9);
  border-radius: 10px;
  padding: 20px;
}
h2 { text-align: center; }
textarea, button, input { width: 100%; margin: 5px 0; padding: 10px; }
ul { list-style: none; padding-left: 0; }
li { margin: 5px 0; }
button { cursor: pointer; }
button:active { transform: scale(1.05); transition: 0.1s; }
#authForm { max-width: 400px; margin: 50px auto; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 10px; }
#toggleAuth { text-align:center; margin-top:10px; cursor:pointer; color:blue; }
</style>
</head>
<body>

<!-- 登录/注册表单 -->
<div id="authForm">
  <h2 id="formTitle">登录</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="password" placeholder="密码">
  <button id="authButton">登录</button>
  <div id="toggleAuth">切换到注册</div>
</div>

<!-- 日志主页面 -->
<div class="container" id="mainPage" style="display:none;">
  <h2>生活日志</h2>
  <textarea id="lifeLog" placeholder="写下今天的日志"></textarea>
  <button id="uploadBtn">上传日志</button>

  <h3>最近5条日志</h3>
  <ul id="recentLogs"></ul>

  <button id="historyBtn">历史记录</button>
  <ul id="historyLogs" style="display:none"></ul>
</div>

<script type="module">
// Firebase 初始化
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeMdvnKz7xDdiObz6eKCHJ3ZEX5Xj7AVI",
  authDomain: "first-ba4c0.firebaseapp.com",
  projectId: "first-ba4c0",
  storageBucket: "first-ba4c0.appspot.com",
  messagingSenderId: "877853934641",
  appId: "1:877853934641:web:678fc96d4054762f9fc110",
  measurementId: "G-DETSMZTR64"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let isLogin = true;
let currentUser = null;

// 登录/注册函数
function handleAuth(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!email || !password) return alert('请输入邮箱和密码');

  if(isLogin){
    // 登录
    signInWithEmailAndPassword(auth, email, password)
      .then(res => {
        currentUser = res.user;
        document.getElementById('authForm').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        loadRecentLogs();
      })
      .catch(err => alert('登录失败: '+err.message));
  } else {
    // 注册
    createUserWithEmailAndPassword(auth, email, password)
      .then(res => {
        alert('注册成功！请登录');
        toggleAuthForm();
      })
      .catch(err => alert('注册失败: '+err.message));
  }
}

// 切换登录/注册表单
function toggleAuthForm(){
  isLogin = !isLogin;
  document.getElementById('formTitle').textContent = isLogin ? '登录' : '注册';
  document.getElementById('authButton').textContent = isLogin ? '登录' : '注册';
  document.getElementById('toggleAuth').textContent = isLogin ? '切换到注册' : '切换到登录';
}

// 上传日志
function addLifeLog() {
  const logBtn = document.getElementById('uploadBtn');
  const text = document.getElementById('lifeLog').value.trim();
  if (!text) return alert('日志不能为空');

  const user = currentUser;
  if (!user) return alert('请先登录');
  const userId = user.uid;

  logBtn.style.transition = '0.2s';
  logBtn.style.transform = 'scale(1.1)';

  addDoc(collection(db, 'logs'), {
    uid: userId,
    text,
    ts: Date.now()
  })
  .then(() => {
    document.getElementById('lifeLog').value = '';
    loadRecentLogs();
    logBtn.style.backgroundColor = '#4CAF50';
    setTimeout(()=>{ logBtn.style.transform='scale(1)'; },200);
  })
  .catch(err => {
    alert('上传失败: '+err.message);
    logBtn.style.backgroundColor = '#f44336';
    setTimeout(()=>{ logBtn.style.backgroundColor = '#4CAF50'; },500);
  });
}

// 加载最近5条和历史记录
async function loadRecentLogs() {
  const userId = currentUser.uid;
  const recentLogs = document.getElementById('recentLogs');
  const historyLogs = document.getElementById('historyLogs');
  recentLogs.innerHTML = '';
  historyLogs.innerHTML = '';

  const q = query(collection(db, 'logs'), where('uid','==',userId), orderBy('ts','desc'));
  const snapshot = await getDocs(q);
  snapshot.docs.forEach((doc,i)=>{
    const li = document.createElement('li');
    li.textContent = doc.data().text;
    if(i<5) recentLogs.appendChild(li);
    historyLogs.appendChild(li.cloneNode(true));
  });
}

// 切换历史记录显示
function toggleHistory(){
  const el = document.getElementById('historyLogs');
  el.style.display = el.style.display==='none'?'block':'none';
}

// ====== 修复模块作用域问题 ======
window.handleAuth = handleAuth;
window.toggleAuthForm = toggleAuthForm;
window.addLifeLog = addLifeLog;
window.toggleHistory = toggleHistory;

// ====== 绑定按钮事件 ======
document.getElementById('authButton').addEventListener('click', handleAuth);
document.getElementById('toggleAuth').addEventListener('click', toggleAuthForm);
document.getElementById('uploadBtn').addEventListener('click', addLifeLog);
document.getElementById('historyBtn').addEventListener('click', toggleHistory);

</script>
</body>
</html>
